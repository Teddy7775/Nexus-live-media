; =============================================================
; Nexus Live Media — PHP settings for Hostinger (PHP-FPM)
; File: public_html/.user.ini
; Hostinger reads this file automatically for PHP-FPM configs.
; Changes take effect within ~5 minutes (PHP-FPM cache TTL).
; =============================================================

; ── Security ─────────────────────────────────────────────────
display_errors       = Off
display_startup_errors = Off
log_errors           = On
error_reporting      = E_ALL

; ── Session hardening ────────────────────────────────────────
; cookie_httponly: JS cannot read the session cookie (XSS protection)
; use_strict_mode: prevents session fixation attacks
; NOTE: cookie_secure is intentionally omitted — the .htaccess 301
; redirect ensures users land on HTTPS, and forcing secure cookies
; at PHP level can break sessions on the initial redirect.
session.cookie_httponly = On
session.use_strict_mode = On
session.gc_maxlifetime  = 1800

; ── Upload / execution limits ────────────────────────────────
upload_max_filesize  = 8M
post_max_size        = 10M
max_execution_time   = 60
memory_limit         = 128M
