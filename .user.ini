; =============================================================
; Nexus Live Media — PHP settings for Hostinger (PHP-FPM)
; File: public_html/.user.ini  (picked up automatically, ~5 min TTL)
; =============================================================

; Security
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL
expose_php             = Off

; The site no longer uses PHP sessions (form tokens are signed and stateless)

; Limits
upload_max_filesize = 8M
post_max_size       = 10M
max_execution_time  = 60
memory_limit        = 128M
