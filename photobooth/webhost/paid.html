<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Thank you</title>
<style>
:root{--bg:#f4f6fa;--text:#111827;--muted:#5b6578;--ok:#138a55}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f16;--text:#eef1f7;--muted:#9aa5ba;--ok:#46e0a0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
main{max-width:26em}
.tick{width:72px;height:72px;border-radius:50%;background:var(--ok);margin:0 auto 18px;position:relative}
.tick::after{content:"";position:absolute;left:25px;top:14px;width:20px;height:36px;border:solid #fff;border-width:0 7px 7px 0;transform:rotate(45deg)}
h1{margin:0 0 8px;font-size:1.6rem}
p{margin:0 0 10px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="tick" aria-hidden="true"></div>
  <h1>Thank you!</h1>
  <p>Look at the booth screen: it carries on by itself as soon as your payment arrives.</p>
  <p>You can close this page. If you did not pay, nothing was charged.</p>
</main>
</body>
</html>
